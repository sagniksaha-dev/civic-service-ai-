<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicAI - Citizen Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
  <div class="disclaimer-banner">
    <span>⚠️</span>
    <span><strong>Prototype Notice:</strong> Fictional Civic Portal Simulation. Do not enter real sensitive personal details.</span>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo">📝</span>
        <h1 class="auth-title">Citizen Registration</h1>
        <p class="auth-subtitle">Create a verified citizen account for civic services</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" class="form-control" placeholder="Rahul Das" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="rahul@example.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required minlength="4" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password <span class="required">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••••••" required minlength="4" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-secondary btn-lg" style="width: 100%; margin-top: 8px;">
          Create Citizen Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="/static/login.html">Sign In here</a>
        <div style="margin-top: 12px;">
          <a href="/static/index.html" style="color: var(--text-muted); font-size: 13px;">← Return to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
